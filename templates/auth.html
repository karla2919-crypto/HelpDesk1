{% extends "base.html" %}{% block c %}
<div class="card narrow">
<h1>{{ 'Crear cuenta' if registro else 'Iniciar sesión' }}</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
{% if registro %}
<label for="nombre">Nombre completo</label><input id="nombre" name="nombre" maxlength="80" required>
<label for="usuario">Usuario</label><input id="usuario" name="usuario" maxlength="40" required>
<label for="email">Correo</label><input id="email" name="email" type="email" maxlength="120" required>
<label for="tel">Teléfono</label><input id="tel" name="tel" maxlength="30">
{% else %}
<label for="usuario">Usuario o correo</label><input id="usuario" name="usuario" required autofocus>
{% endif %}
<label for="clave">Contraseña</label><input id="clave" name="clave" type="password" required {{ 'minlength=8' if registro }}>
<p><button class="btn">{{ 'Crear cuenta' if registro else 'Entrar' }}</button></p>
</form>
<p class="sub">{% if registro %}¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>{% else %}¿Necesitas ayuda y no tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>{% endif %}</p>
</div>{% endblock %}
